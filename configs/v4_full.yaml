# v4 full retrain (production-size data), local llama-server on port 8090.
#
# Port note: 8090, NOT the default 8080 — LlamaServer adopts whatever answers
# /health on its port, so an ssh-tunneled remote server on 8080 would be
# silently adopted (different backend -> embedding mismatch, and slower).
# Keep extraction and training on the SAME server.
#
# Embeddings go over HTTP: if http_proxy/https_proxy are set without a
# no_proxy entry for localhost, every request is routed through the proxy
# (measured: 6.4 -> 37.3 texts/s once localhost bypasses it). Run with
#   no_proxy=localhost,127.0.0.1 uv run python -m decision_lab \
#     --config configs/v4_full.yaml train-dynamic
#
generator:
  num_train: 10000
  num_test_indist: 1000
  num_test_heldout: 1000
  seed: 42
  heldout_templates: ["report", "config_file"]
  num_breakout_train: 4000
  num_breakout_test: 500

questions:
  choice:
    sentiment:
      options:
        positive: "Positive sentiment"
        negative: "Negative sentiment"
        neutral: "Neutral sentiment"
    urgency:
      options:
        low: "Low priority"
        medium: "Medium priority"
        high: "High priority"
        critical: "Requires immediate attention"
  score:
    quality:
      levels: ["Poor", "Fair", "Good", "Excellent"]
  noul:
    is_actionable: "Does this state require a response or action?"
    contains_pii: "Does this state contain personally identifiable information?"
    is_urgent: "Is this state time-sensitive?"

model:
  gguf_path: "models/Qwen3.5-0.8B-UD-Q4_K_XL.gguf"
  context_length: 2048
  server_port: 8090
  pooling: "last"

dynamic_head:
  hidden_dim: 256
  d_k: 128
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.00001
  batch_size: 128
  max_epochs: 100
  patience: 20
  anchor_epochs: 30
  variants_per_question: 3
  breakout_weight: 3
  include_summary_field: true
  max_fields: 16
  shape_augmentation: true
  checkpoint_filename: "head_dynamic_v4.pt"

calibration:
  holdout_fraction: 0.1
  lr: 0.01
  max_iter: 1000
