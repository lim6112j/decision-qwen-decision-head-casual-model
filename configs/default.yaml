# Synthetic state generator
generator:
  num_train: 5000
  num_test_indist: 1000
  num_test_heldout: 1000
  seed: 42
  heldout_templates: ["report", "log_entry", "config_file"]

# Fixed question bank (single forward pass evaluates all questions per state)
questions:
  choice:
    sentiment:
      options:
        positive: "Positive sentiment"
        negative: "Negative sentiment"
        neutral: "Neutral sentiment"
    urgency:
      options:
        low: "Low priority"
        medium: "Medium priority"
        high: "High priority"
        critical: "Requires immediate attention"
  score:
    quality:
      levels: ["Poor", "Fair", "Good", "Excellent"]   # rubric levels 0..3
  noul:
    is_actionable: "Does this state require a response or action?"
    contains_pii: "Does this state contain personally identifiable information?"
    is_urgent: "Is this state time-sensitive?"

# Backbone (llama-server)
model:
  gguf_path: "models/Qwen3.5-0.8B-UD-Q4_K_XL.gguf"
  context_length: 2048
  server_port: 8080
  pooling: "last"         # "last" or "mean"

# Typed Decision Head
head:
  hidden_dim: 256
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.00001
  batch_size: 64
  max_epochs: 100
  patience: 10

# Dynamic Decision Head (attention-based slot filling)
dynamic_head:
  hidden_dim: 256
  d_k: 128
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.00001
  batch_size: 64
  max_epochs: 100
  patience: 10
  anchor_epochs: 30
  variants_per_question: 3

# Post-training temperature calibration (per question)
calibration:
  holdout_fraction: 0.1
  lr: 0.01
  max_iter: 1000

# Prompt LM
prompt_lm:
  temperature: 0.0
  max_tokens: 256
  system_prompt_zero_shot: |
    You are a text analysis assistant. Given the document below, answer each
    question precisely using ONLY the document content.
    Output format (one line per question, exactly these keys):
    sentiment: <positive|negative|neutral>
    urgency: <low|medium|high|critical>
    quality: <0|1|2|3>
    is_actionable: <true|false>
    contains_pii: <true|false>
    is_urgent: <true|false>

  system_prompt_cot: |
    You are a text analysis assistant. Given the document below, think
    step-by-step about each question, then answer.
    Output format:
    Reasoning: <brief reasoning>
    sentiment: <positive|negative|neutral>
    urgency: <low|medium|high|critical>
    quality: <0|1|2|3>
    is_actionable: <true|false>
    contains_pii: <true|false>
    is_urgent: <true|false>

# Benchmark
benchmark:
  warmup_runs: 5
  timed_runs: 50
  max_test_states: 200      # subsample test sets (0 = full set)
  latency_sample_size: 5    # states used for warmup/timed latency runs

# Web UI
web:
  host: "127.0.0.1"
  port: 8000
  num_states: 8          # pre-generated states offered in the UI
  random_seed: 42