<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decision Lab — Typed Question Analysis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235b8cff'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Decision Lab</h1>
    <p class="subtitle">Typed question analysis — choice / score / noul in a single forward pass</p>
    <span id="status" class="status-dot" title="checking server…"></span>
  </header>

  <main>
    <section id="controls">
      <h2>Model</h2>
      <div id="agent-cards" role="radiogroup" aria-label="Model selection">
        <p class="loading">Loading models…</p>
      </div>

      <h2>State</h2>
      <select id="state-select" aria-label="State selection"></select>
      <textarea id="custom-text" class="hidden" rows="8"
                placeholder='Paste raw text, an email, a ticket, or a JSON document…'></textarea>

      <div class="button-row">
        <button id="run-btn" disabled>Run</button>
        <button id="compare-btn" disabled>Compare all 3</button>
      </div>

      <div id="summary" class="summary hidden"></div>
    </section>

    <section id="dynamic-panel">
      <h2>Dynamic Questions <span class="hint">— option values as inputs</span></h2>
      <div id="dynamic-builder"></div>
      <div class="button-row">
        <button id="add-question-btn">New Question</button>
        <button id="run-dynamic-btn" disabled>Run Dynamic Head</button>
      </div>
      <div id="dynamic-summary" class="summary hidden"></div>
    </section>

    <section id="state-panel">
      <h2>State <span id="state-type-badge" class="type-badge hidden"></span></h2>
      <pre id="state-text" class="state-text loading">No state selected yet.</pre>
    </section>

    <section id="results-panel">
      <h2>Results</h2>
      <div id="results"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
